<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Pro - Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('styles/bTile.jpg');
            background-size: 150px 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            text-align: center;
        }
        .redirect-container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <h1>🃏 Blackjack Pro</h1>
        <div class="spinner"></div>
        <p>Redirecting to enhanced version...</p>
        <p><a href="frontend/enhanced_index.html">Click here if not redirected automatically</a></p>
    </div>

    <script>
        // Redirect after 2 seconds
        setTimeout(() => {
            window.location.href = 'frontend/enhanced_index.html';
        }, 2000);
    </script>
</body>
</html>
